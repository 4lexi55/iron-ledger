<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Iron Ledger</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--bg:#eef6f4;--card:#fff;--text:#102a2a;--muted:#5b6f6f;--pri:#0f766e;--pri2:#115e59;--line:#d9e7e4}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(180deg,#f8fbfa,var(--bg));color:var(--text)}
.wrap{max-width:760px;margin:0 auto;padding:20px} .hero{background:linear-gradient(135deg,var(--pri),#14b8a6);color:#fff;border-radius:20px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.hero h1{margin:0 0 6px;font-size:28px}.hero p{margin:0;color:rgba(255,255,255,.9)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:16px;box-shadow:0 8px 24px rgba(16,42,42,.06)}
.row{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:14px;padding:14px 16px;font-weight:700;background:var(--pri);color:#fff;cursor:pointer}.btn.secondary{background:#e8f4f2;color:var(--pri2)}
.btn:active{transform:translateY(1px)} label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px} input{width:100%;padding:13px 14px;border-radius:14px;border:1px solid #cbdad7;font-size:16px;background:#fff} ul{padding-left:20px} .hint{color:var(--muted);font-size:13px;line-height:1.45}
small.badge{display:inline-block;background:rgba(255,255,255,.18);padding:7px 10px;border-radius:999px;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <small class="badge">Ready to install</small>
    <h1>Iron Ledger</h1>
    <p>Track workouts, weights, and progress.</p>
  </div>

  <div class="card">
    <div class="row">
      <button class="btn" id="installBtn">Install app</button>
      <button class="btn secondary" id="shareBtn">Share link</button>
    </div>
    <p class="hint" id="status">If install is available, your browser will show a prompt. On iPhone, use Safari → Share → Add to Home Screen.</p>
  </div>

  <div class="card">
    <h2 style="margin-top:0">Quick workout log</h2>
    <label>Workout</label><input id="workout" placeholder="Push day">
    <label>Sets / reps</label><input id="sets" placeholder="3 x 10">
    <label>Notes</label><input id="notes" placeholder="Felt strong today">
    <div class="row" style="margin-top:14px"><button class="btn" id="saveBtn">Save entry</button><button class="btn secondary" id="clearBtn">Clear</button></div>
    <ul id="list"></ul>
  </div>
</div>
<script>
let deferredPrompt=null; const key='iron-ledger-log-v1'; const list=document.getElementById('list');
function render(){const items=JSON.parse(localStorage.getItem(key)||'[]'); list.innerHTML=items.map(x=>`<li><b>${x.workout}</b> — ${x.sets}<br><span class="hint">${x.notes}</span></li>`).join('')||'<li class="hint">No entries yet.</li>'}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('status').textContent='Install is available. Tap Install app.'});
document.getElementById('installBtn').onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null}else{document.getElementById('status').textContent='Install is not ready yet. Try visiting the site again in Chrome or use Safari Share → Add to Home Screen on iPhone.'}}
document.getElementById('shareBtn').onclick=async()=>{try{await navigator.share({title:'Iron Ledger',text:'Workout tracker',url:location.href})}catch(e){}}
document.getElementById('saveBtn').onclick=()=>{const items=JSON.parse(localStorage.getItem(key)||'[]'); items.unshift({workout:workout.value||'Workout',sets:sets.value||'1 x 1',notes:notes.value||''}); localStorage.setItem(key,JSON.stringify(items)); render(); workout.value=sets.value=notes.value=''};
document.getElementById('clearBtn').onclick=()=>{localStorage.removeItem(key); render()};
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
render();
</script>
</body>
</html>
